# Continuous integration (docs/specification.md, "Repository, testing and milestones").
#
#   rust  formatting, clippy and the workspace tests (golden cards, export vectors)
#   wasm  the WASM package, the release CLI, and native-vs-WASM determinism
#   web   svelte-check, vitest, and Playwright end to end (uses the wasm job's package)
#   r     the copied R snippet (tidyverse and base R) under Rscript against a fresh export
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the WASM package
        working-directory: web
        run: npm run wasm
      - name: Build the release CLI
        run: cargo build --release -p wl-cli
      - name: Native and WASM games are byte-identical
        run: node scripts/check-determinism.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm/pkg
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    needs: wasm
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Word lists and precomputed results
        run: node scripts/sync-data.mjs
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm/pkg
      - name: Type check
        run: npx svelte-check --tsconfig ./tsconfig.json
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npx vite build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  r:
    runs-on: ubuntu-latest
    env:
      ZIP_NAME: wordlology-card-20260930-1533.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install readr and dplyr
        run: Rscript -e 'install.packages(c("readr", "dplyr"))'
      - name: Build the CLI
        run: cargo build --release -p wl-cli
      - name: Export a card
        run: |
          out="$RUNNER_TEMP/export"
          ./target/release/wordlology export --level card --strategy info_proportional --opener crane \
            --targets sample:300 --replicates 5 --out "$out"
          mkdir -p ~/Downloads
          (cd "$out" && zip -q "$HOME/Downloads/$ZIP_NAME" configs.csv games.csv plays.csv distribution.csv summary.csv)
          unzip -l "$HOME/Downloads/$ZIP_NAME"
      - name: The specification's snippet (tidyverse)
        run: |
          # The snippet exactly as docs/specification.md prints it (vitest checks the app copies the same text).
          awk '/^```r$/{on=1; next} /^```$/{if (on) exit} on' docs/specification.md > "$RUNNER_TEMP/tidy.R"
          grep -q "$ZIP_NAME" "$RUNNER_TEMP/tidy.R"
          Rscript -e "source('$RUNNER_TEMP/tidy.R'); source('web/scripts/check-export-types.R')"
      - name: The base-R snippet
        run: |
          rm -rf "$HOME/Downloads/${ZIP_NAME%.zip}"
          node web/scripts/r-snippet.mjs --zip "$ZIP_NAME" --base > "$RUNNER_TEMP/base.R"
          cat "$RUNNER_TEMP/base.R"
          Rscript --vanilla -e "source('$RUNNER_TEMP/base.R'); source('web/scripts/check-export-types.R')"
