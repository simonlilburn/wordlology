<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="wordlology: a five-letter word game that zooms out into the statistics of guessing strategies." />
    <meta name="theme-color" content="#fbfbf8" />
    <title>wordlology</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%236aaa64'/><g stroke='white' stroke-width='1.9' fill='none' stroke-linecap='round'><path d='M12 4.5V9.5'/><path d='M12 9.5C12 13 6.6 12.2 6.6 17.2'/><path d='M12 9.5V17.4'/><path d='M12 9.5C12 13 17.4 12.2 17.4 17.2'/></g><g fill='white'><circle cx='6.6' cy='18.6' r='1.6'/><circle cx='12' cy='18.8' r='1.6'/><circle cx='17.4' cy='18.6' r='1.6'/></g></svg>" />
    <script>
      // Apply a saved dark Appearance before first paint (app/theme.svelte.ts takes over once the app starts).
      try {
        var t = (JSON.parse(localStorage.getItem('wordlology:display:v1') || '{}') || {}).theme;
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
