[package]
name = "wl-wasm"
description = "The wasm-bindgen API and the worker message protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wl-core = { workspace = true }
wl-strategy = { workspace = true }
wl-engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
# Size matters more than the last few percent of speed for the first load;
# -O3 keeps the hot loops fast while wasm-opt strips what it can.
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals"]
